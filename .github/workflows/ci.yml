name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Content guards
        # Rules: see content-guards.json and scripts/check-content.mjs
        run: node scripts/check-content.mjs --config content-guards.json --require-build
